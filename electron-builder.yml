appId: com.aiusagetracker.app
productName: AI Usage Tracker
directories:
  output: out
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules/**/*.ts"
  - "!node_modules/**/*.map"
extraResources:
  - from: build/tray
    to: tray
mac:
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.developer-tools
  artifactName: "${productName}-${version}.${ext}"
dmg:
  title: AI Usage Tracker
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
asar: true
